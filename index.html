<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>背单词</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#F0F4F8;--card-bg:#FFFFFF;--text-main:#1E293B;--text-sub:#64748B;
  --border:#E2E8F0;--primary:#3B82F6;--primary-light:#EFF6FF;
  --success:#10B981;--warning:#F59E0B;--danger:#EF4444;--radius:16px;
  --bg-extra:radial-gradient(circle at 15% 20%,rgba(200,224,244,.55) 0%,transparent 35%),radial-gradient(circle at 85% 75%,rgba(226,232,240,.5) 0%,transparent 40%),radial-gradient(circle at 50% 50%,rgba(255,255,255,.7) 0%,transparent 60%);
  --btn-primary-bg:linear-gradient(135deg,#3B82F6,#2563EB);
  --btn-primary-shadow:0 4px 12px rgba(59,130,246,.3);
  --switch-bg:#E2E8F0;--switch-knob:#FFFFFF;--switch-border:#CBD5E1;
}
body.dark{
  --bg:#0f1115;--card-bg:#171a21;--text-main:#e8eaed;--text-sub:#8b93a5;
  --border:#252a35;--primary:#7c5cff;--primary-light:#2a2f45;
  --success:#3ed67e;--warning:#ffbe3d;--danger:#ff6b5b;
  --bg-extra:none;
  --btn-primary-bg:linear-gradient(135deg,#4f6bff,#7c5cff);
  --btn-primary-shadow:0 4px 12px rgba(90,110,255,.35);
  --switch-bg:#2a2f45;--switch-knob:#7c5cff;--switch-border:#3d4557;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text-main);min-height:100vh;line-height:1.6;background-image:var(--bg-extra);background-attachment:fixed;transition:background-color .25s ease,color .25s ease}
.page{display:none;max-width:720px;margin:0 auto;padding:20px 16px 60px}
.page.active{display:block}
.hero{text-align:center;padding:24px 0 16px;position:relative}
.hero h1{font-size:28px;font-weight:800;letter-spacing:1px;color:var(--text-main)}
.hero p{color:var(--text-sub);font-size:13px;margin-top:6px}

.theme-switch{position:absolute;top:20px;right:0;width:64px;height:32px;border-radius:16px;background:var(--switch-bg);border:1px solid var(--switch-border);cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 7px;overflow:hidden;transition:background .3s,border-color .3s;font-family:inherit}
.theme-switch:active{transform:scale(.96)}
.theme-slider{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--switch-knob);box-shadow:0 2px 6px rgba(0,0,0,.15);left:2px;top:2px;transition:transform .3s cubic-bezier(.4,0,.2,1),background .3s;z-index:1}
body.dark .theme-slider{transform:translateX(32px)}
.theme-icon{position:relative;z-index:2;font-size:13px;line-height:1;user-select:none}

/* 统计卡片 */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:0 2px 4px rgba(0,0,0,.03)}
.stat-label{font-size:11px;color:var(--text-sub);letter-spacing:.5px;margin-bottom:4px}
.stat-value{font-size:22px;font-weight:800;color:var(--primary);line-height:1.2}
.stat-value small{font-size:12px;color:var(--text-sub);font-weight:500;margin-left:2px}

/* 双按钮 */
.main-actions{display:flex;gap:10px;margin-bottom:14px}
.btn-half{flex:1;padding:16px 12px;border:none;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s;position:relative;color:#fff}
.btn-half:active{transform:scale(.97)}
.btn-review{background:linear-gradient(135deg,#F59E0B,#D97706);box-shadow:0 4px 12px rgba(245,158,11,.3)}
.btn-study{background:var(--btn-primary-bg);box-shadow:var(--btn-primary-shadow)}
.btn-half-title{display:block;font-size:16px;font-weight:800}
.btn-half-sub{display:block;font-size:11px;font-weight:500;opacity:.85;margin-top:2px;letter-spacing:.5px}

.search-wrap{position:relative;margin-bottom:14px}
.search-box{width:100%;padding:14px 44px 14px 16px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-main);font-size:15px;font-family:inherit;outline:none;transition:.18s}
.search-box:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.search-box::placeholder{color:var(--text-sub);opacity:.6}
.search-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-sub);opacity:.6;font-size:16px;pointer-events:none}
.search-clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-sub);opacity:.7;font-size:18px;cursor:pointer;display:none;user-select:none}
.search-clear.show{display:block}
.search-results{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);max-height:400px;overflow-y:auto;margin-bottom:14px;display:none;box-shadow:0 4px 6px -1px rgba(0,0,0,.05)}
.search-results.show{display:block}
.search-item{padding:12px 16px;border-bottom:1px dashed var(--border);cursor:pointer;transition:.15s}
.search-item:last-child{border-bottom:none}
.search-item:hover{background:var(--primary-light)}
.search-word{font-size:15px;font-weight:700;color:var(--primary)}
.search-meta{font-size:12px;color:var(--text-sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-empty{padding:20px;text-align:center;color:var(--text-sub);opacity:.6;font-size:13px}

.panel{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 2px 4px rgba(0,0,0,.02)}
.label{font-size:12px;color:var(--text-sub);margin-bottom:10px;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px dashed var(--border);color:var(--text-sub);border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;transition:.18s;font-family:inherit}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}

.btn-primary{width:100%;padding:16px;border:none;border-radius:var(--radius);font-size:16px;font-weight:700;background:var(--btn-primary-bg);color:#fff;cursor:pointer;font-family:inherit;box-shadow:var(--btn-primary-shadow);transition:.2s}
.btn-primary:active{transform:scale(.98)}
.row-links{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.link{flex:1;min-width:100px;background:var(--card-bg);border:1px solid var(--border);color:var(--text-sub);border-radius:12px;padding:12px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.18s}
.link:hover{color:var(--primary);border-color:var(--primary)}

.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.icon-btn{background:var(--card-bg);border:1px solid var(--border);color:var(--text-sub);width:38px;height:38px;border-radius:11px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;font-family:inherit;transition:.18s}
.icon-btn:hover{color:var(--primary);border-color:var(--primary)}
.progress-wrap{flex:1}
.progress-bar{height:7px;background:var(--border);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--primary);border-radius:99px;transition:width .35s}
.progress-text{font-size:11px;color:var(--text-sub);margin-top:5px;text-align:center}
.title{flex:1;text-align:center;font-weight:700;font-size:15px}

.card{background:var(--card-bg);border:1px dashed var(--border);border-radius:var(--radius);padding:26px 20px;margin-bottom:16px;box-shadow:0 4px 6px -1px rgba(0,0,0,.05);position:relative}
.view-banner{background:var(--primary-light);border:1px dashed var(--primary);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:var(--primary);text-align:center}
.word-head{text-align:center;padding-bottom:6px}
.word-en{font-size:36px;font-weight:800;letter-spacing:.5px;word-break:break-word;color:var(--text-main)}
body.dark .word-en{background:linear-gradient(135deg,#e8eaed,#a8b6ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.phonetic{color:var(--text-sub);font-size:14px;margin-top:6px}
.spk-big{display:block;margin:16px auto 0;background:var(--bg);border:1px solid var(--border);color:var(--primary);padding:9px 20px;border-radius:11px;font-size:13px;cursor:pointer;font-family:inherit;transition:.18s}
.spk-big:hover{background:var(--primary-light);border-color:var(--primary)}
.hint{text-align:center;color:var(--text-sub);opacity:.6;font-size:13px;margin-top:24px;padding-top:18px;border-top:1px dashed var(--border)}

.reveal{margin-top:20px;padding-top:20px;border-top:1px dashed var(--border)}
.pos-line{margin-bottom:6px}
.pos{display:inline-block;background:var(--primary-light);color:var(--primary);font-size:12px;font-weight:700;padding:2px 9px;border-radius:6px}
body.dark .pos{background:#2a2f45;color:#9fb0ff}
.zh{font-size:19px;font-weight:600;color:var(--text-main);margin-top:6px}
.zh div{margin:2px 0}
.en-def{color:var(--text-sub);font-size:13px;margin-top:10px;font-style:italic}
.forms{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:14px}
.forms-title{font-size:11px;color:var(--text-sub);font-weight:700;letter-spacing:.5px;margin-bottom:8px}
.forms-list{display:flex;flex-wrap:wrap;gap:8px}
.form-item{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:5px 11px;font-size:13px}
.form-item b{color:var(--text-sub);font-weight:500;margin-right:5px}
.form-item span{color:var(--text-main)}

.example{background:var(--bg);border-left:3px solid var(--primary);border-radius:0 12px 12px 0;padding:14px 16px;margin-top:16px}
.ex-en{color:var(--text-main);font-size:15px;line-height:1.6}
.ex-zh{color:var(--text-sub);font-size:13px;margin-top:6px}
.spk-mini{background:transparent;border:1px dashed var(--border);color:var(--text-sub);font-size:11px;padding:5px 12px;border-radius:8px;margin-top:10px;cursor:pointer;font-family:inherit;transition:.18s}
.spk-mini:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-light)}

.block{margin-top:16px}
.block-title{font-size:12px;color:var(--text-sub);margin-bottom:8px;font-weight:600}
.col-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.col-list li{background:var(--bg);border-radius:9px;padding:9px 13px;font-size:13.5px;color:var(--text-main)}
.gram{background:rgba(252,211,77,.15);border:1px dashed #FCD34D;color:#92400E;border-radius:11px;padding:11px 14px;font-size:13px;margin-top:14px}
body.dark .gram{background:#2a2410;border-color:#4a3d15;color:#ffd77a}

.fold{background:var(--bg);border:1px dashed var(--border);border-radius:12px;margin-top:10px;overflow:hidden}
.fold-btn{width:100%;background:transparent;border:none;color:var(--text-sub);padding:13px 15px;font-size:13.5px;text-align:left;cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center}
.fold-btn:hover{color:var(--primary)}
.fold-btn:after{content:"v";font-size:11px;color:var(--text-sub);opacity:.6;transition:transform .2s}
.fold.open .fold-btn:after{transform:rotate(180deg)}
.fold-body{display:none;padding:0 15px 15px;font-size:13.5px;color:var(--text-main);line-height:1.7}
.fold.open .fold-body{display:block}
.tag-list{display:flex;flex-wrap:wrap;gap:7px}
.tag{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:5px 11px;font-size:13px;color:var(--primary)}
.tag.ant{color:var(--danger)}
.conf-item{padding:9px 0;border-bottom:1px dashed var(--border)}
.conf-item:last-child{border-bottom:none}

.root-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.root-name{font-size:16px;font-weight:800;color:var(--primary);font-family:"SF Mono",Menlo,monospace}
.root-mean{font-size:13px;color:var(--text-main)}
.root-word-note{font-size:12.5px;color:var(--text-main);margin-top:3px}

.root-group-title{font-size:13px;font-weight:700;color:var(--primary);padding:14px 0 6px;letter-spacing:.5px}
.root-card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden}
.root-card-head{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:.15s}
.root-card-head:hover{background:var(--primary-light)}
.root-card-head-left{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.root-card-name{font-size:15px;font-weight:800;color:var(--primary);font-family:"SF Mono",Menlo,monospace}
.root-card-mean{font-size:12.5px;color:var(--text-sub)}
.root-card-arrow{font-size:11px;color:var(--text-sub);opacity:.6;transition:transform .2s}
.root-card.open .root-card-arrow{transform:rotate(180deg)}
.root-card-body{display:none;padding:0 14px 14px}
.root-card.open .root-card-body{display:block}
.root-word{background:var(--card-bg);border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:6px;cursor:pointer;transition:.15s}
.root-word:hover{background:var(--primary-light);border-color:var(--primary)}
.root-word-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.root-word-en{font-size:14px;font-weight:700;color:var(--primary);font-family:"SF Mono",Menlo,monospace}
.root-word-split{font-size:12px;color:var(--text-sub);font-family:"SF Mono",Menlo,monospace}

.actions{display:flex;gap:10px}
.btn-rate{flex:1;padding:17px 6px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.18s;color:#fff}
.btn-rate:active{transform:scale(.97)}
.btn-rate.red{background:var(--danger)}
.btn-rate.amber{background:var(--warning);color:#fff}
.btn-rate.green{background:var(--success)}
.btn-rate:hover{filter:brightness(1.08)}
.btn-undo{flex:1;padding:16px 8px;border:1px dashed var(--border);border-radius:14px;background:var(--card-bg);color:var(--text-sub);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-undo:hover{color:var(--primary);border-color:var(--primary)}

.finished{text-align:center;padding:50px 20px}
.finish-icon{font-size:52px;margin-bottom:14px}
.finished h2{font-size:23px;margin-bottom:10px}
.finished p{color:var(--text-sub);font-size:14px;margin:5px 0}
.finished b{color:var(--primary);font-size:18px}

.note-item{display:flex;align-items:center;gap:10px;background:var(--card-bg);border:1px dashed var(--border);border-radius:14px;padding:13px 15px;margin-bottom:9px}
.note-main{flex:1;min-width:0}
.note-word{font-size:17px;font-weight:700;color:var(--text-main)}
.note-zh{font-size:12.5px;color:var(--text-sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;color:var(--text-sub);opacity:.6;padding:60px 0;font-size:14px}

.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:var(--text-main);color:var(--bg);padding:11px 22px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:.25s;z-index:10000;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.clickable{cursor:pointer}
.tag.clickable:hover{background:var(--primary-light);color:var(--primary)}
.popup{position:fixed;z-index:9999;max-width:300px;background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.12);font-size:13.5px;color:var(--text-main);display:none;word-break:break-word}
.popup.show{display:block}
.popup-word{font-size:18px;font-weight:800;color:var(--primary);margin-bottom:2px;padding-right:16px}
.popup-ph{font-size:12px;color:var(--text-sub);margin-bottom:8px}
.popup-zh{color:var(--text-main);margin-top:4px}
.popup-zh[data-jump]{cursor:pointer;text-decoration:underline dotted}
.popup-en{color:var(--text-sub);font-style:italic;margin-top:8px;font-size:12.5px}
.popup-pos{display:inline-block;background:var(--primary-light);color:var(--primary);font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:6px}
.popup-loading{color:var(--text-sub);opacity:.7;font-size:12.5px}
.popup-close{position:absolute;top:8px;right:10px;color:var(--text-sub);opacity:.6;cursor:pointer;font-size:14px}
.popup-tip{font-size:11px;color:var(--text-sub);opacity:.7;margin-top:9px;border-top:1px dashed var(--border);padding-top:7px}

.import-panel{background:var(--card-bg);border:1px dashed var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.import-title{font-size:14px;font-weight:700;color:var(--text-main);margin-bottom:6px}
.import-desc{font-size:12.5px;color:var(--text-sub);line-height:1.7;margin-bottom:12px}
.import-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.import-tag{background:var(--bg);border:1px solid var(--border);color:var(--text-sub);border-radius:9px;padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
.import-tag.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.import-btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:14px;font-weight:700;background:var(--btn-primary-bg);color:#fff;cursor:pointer;font-family:inherit}
.import-status{margin-top:10px;font-size:12.5px;color:var(--primary);line-height:1.6;min-height:18px;white-space:pre-wrap}

@media(max-width:420px){
  .word-en{font-size:30px}
  .card{padding:22px 16px}
  .btn-rate{font-size:14px;padding:16px 4px}
  .stat-value{font-size:19px}
}
</style>
</head>
<body>

<div id="page-home" class="page active">
  <div class="hero">
    <h1>背单词</h1>
    <p>六级 · 考研英语二</p>
    <button class="theme-switch" id="themeSwitch" title="切换主题">
      <span class="theme-slider"></span>
      <span class="theme-icon">☀️</span>
      <span class="theme-icon">🌙</span>
    </button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">已掌握</div>
      <div class="stat-value" id="stMastered">0<small>词</small></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">今日已学</div>
      <div class="stat-value" id="stToday">0<small>词</small></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">连续学习</div>
      <div class="stat-value" id="stStreak">0<small>天</small></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">今日待复习</div>
      <div class="stat-value" id="stDue">0<small>词</small></div>
    </div>
  </div>

  <div class="main-actions">
    <button class="btn-half btn-review" id="btnReview">
      <span class="btn-half-title">复习</span>
      <span class="btn-half-sub" id="reviewSub">今天 0 个</span>
    </button>
    <button class="btn-half btn-study" id="btnStudy">
      <span class="btn-half-title">背诵</span>
      <span class="btn-half-sub">新词</span>
    </button>
  </div>

  <div class="search-wrap">
    <input type="text" class="search-box" id="searchBox" placeholder="搜索单词…" autocomplete="off">
    <span class="search-icon">&#128269;</span>
    <span class="search-clear" id="searchClear">&times;</span>
  </div>
  <div class="search-results" id="searchResults"></div>

  <div class="panel"><div class="label">选择单词书</div><div class="chips" id="bookChips"></div></div>
  <div class="panel"><div class="label">排列顺序</div><div class="chips" id="orderChips">
    <button class="chip on" data-v="random">乱序</button>
    <button class="chip" data-v="alpha">A-Z 字母序</button>
    <button class="chip" data-v="freq">高频优先</button>
  </div></div>
  <div class="panel"><div class="label">每轮新词数</div><div class="chips" id="sizeChips">
    <button class="chip" data-v="10">10</button>
    <button class="chip on" data-v="20">20</button>
    <button class="chip" data-v="30">30</button>
    <button class="chip" data-v="50">50</button>
    <button class="chip" data-v="100">100</button>
    <button class="chip" data-v="9999">全部</button>
  </div></div>
  <div class="row-links">
    <button class="link" id="btnRoots">词根词缀</button>
    <button class="link" id="btnNote">生词本<span id="noteCount"> 0</span></button>
    <button class="link" id="btnForms">补全单词用法</button>
    <button class="link" id="btnExportForms">导出词形数据</button>
    <button class="link" id="btnImportToggle">导入完整词库</button>
  </div>

var REVIEW_INTERVALS = {1:1,2:3,3:7,4:15,5:30,6:365};
var reviewData = safeParse("review_data_v1",{});
var stats = safeParse("stats_v1",{lastDate:"",streak:0,todayCount:0,todayDate:""});

function updateStatsOnLearn(){
  var today = todayStr();
  if(stats.todayDate !== today){stats.todayDate = today;stats.todayCount = 0;}
  stats.todayCount++;
  if(stats.lastDate !== today){
    if(stats.lastDate === ""){stats.streak = 1;}
    else{
      var diff = Math.round((parseDate(today) - parseDate(stats.lastDate))/86400000);
      if(diff === 1)stats.streak++;
      else if(diff > 1)stats.streak = 1;
    }
    stats.lastDate = today;
  }
  safeSave("stats_v1",stats);
}

function getDueWords(){
  var today = todayStr();
  var due = [];
  for(var k in reviewData){
    if(!reviewData.hasOwnProperty(k))continue;
    var d = reviewData[k];
    if(d.level < 6 && d.next && d.next <= today){
      var w = WORD_MAP[Object.keys(WORD_MAP).find(function(x){return x.toLowerCase()===k;})];
      if(w)due.push(w);
    }
  }
  due.sort(function(a,b){
    var la = reviewData[a.word.toLowerCase()] ? reviewData[a.word.toLowerCase()].level : 1;
    var lb = reviewData[b.word.toLowerCase()] ? reviewData[b.word.toLowerCase()].level : 1;
    return la - lb;
  });
  return due;
}

function renderStats(){
  document.getElementById("stMastered").innerHTML = Object.keys(reviewData).length + '<small>词</small>';
  var today = todayStr();
  var tc = (stats.todayDate === today) ? stats.todayCount : 0;
  document.getElementById("stToday").innerHTML = tc + '<small>词</small>';
  document.getElementById("stStreak").innerHTML = (stats.streak||0) + '<small>天</small>';
  var dueCount = getDueWords().length;
  document.getElementById("stDue").innerHTML = dueCount + '<small>词</small>';
  document.getElementById("reviewSub").textContent = "今天 " + dueCount + " 个";
}

/* ===== 主题 ===== */
function applyTheme(isDark){
  if(isDark){document.body.classList.add("dark");}
  else{document.body.classList.remove("dark");}
  safeSave("theme_dark",isDark);
}
document.getElementById("themeSwitch").onclick=function(){
  var isDark=!document.body.classList.contains("dark");
  applyTheme(isDark);
};
(function initTheme(){
  var saved=safeParse("theme_dark",false);
  if(saved===true||saved==="true")applyTheme(true);
})();

function fetchSynAnt(word,cb){
  var key=word.toLowerCase();
  if(DM_CACHE[key]){cb(DM_CACHE[key]);return;}
  try{var c=localStorage.getItem("dm_"+key);if(c){var d=JSON.parse(c);DM_CACHE[key]=d;cb(d);return;}}catch(e){}
  var result={syn:[],ant:[]};var pending=2;
  function done(){pending--;if(pending>0)return;DM_CACHE[key]=result;try{localStorage.setItem("dm_"+key,JSON.stringify(result));}catch(e){}cb(result);}
  var x1=new XMLHttpRequest();
  x1.open("GET","https://api.datamuse.com/words?rel_syn="+encodeURIComponent(word)+"&max=8",true);
  x1.onreadystatechange=function(){if(x1.readyState!==4)return;if(x1.status===200){try{var arr=JSON.parse(x1.responseText);for(var i=0;i<arr.length;i++){if(arr[i].word&&arr[i].word.length<25)result.syn.push(arr[i].word);}}catch(e){}}done();};
  x1.onerror=done;x1.ontimeout=done;x1.timeout=8000;x1.send();
  var x2=new XMLHttpRequest();
  x2.open("GET","https://api.datamuse.com/words?rel_ant="+encodeURIComponent(word)+"&max=6",true);
  x2.onreadystatechange=function(){if(x2.readyState!==4)return;if(x2.status===200){try{var arr2=JSON.parse(x2.responseText);for(var j=0;j<arr2.length;j++){if(arr2[j].word&&arr2[j].word.length<25)result.ant.push(arr2[j].word);}}catch(e){}}done();};
  x2.onerror=done;x2.ontimeout=done;x2.timeout=8000;x2.send();
}
function enrichCurrentWithDM(){
  if(!S.revealed||!S.cur||S.finished)return;
  var w=S.cur;if(w._dmFetched)return;
  var needSyn=!w.syn||!w.syn.length;var needAnt=!w.ant||!w.ant.length;
  if(!needSyn&&!needAnt)return;
  w._dmFetched=true;
  fetchSynAnt(w.word,function(data){
    if(data.syn&&data.syn.length&&(!w.syn||!w.syn.length))w.syn=data.syn;
    if(data.ant&&data.ant.length&&(!w.ant||!w.ant.length))w.ant=data.ant;
    if(S.cur&&S.cur.word===w.word&&S.revealed&&!S.finished)renderCard();
  });
}

var S = {book:"all",order:"random",size:20,queue:[],total:0,mastered:0,cur:null,revealed:false,finished:false,newUnknown:0,history:[],mode:"study",unknown:safeParse("vocab_unknown",[])};

var voice=null;
function pickVoice(){
  if(!window.speechSynthesis)return;
  var vs=speechSynthesis.getVoices();
  for(var i=0;i<vs.length;i++){if(/en-GB/i.test(vs[i].lang)){voice=vs[i];break;}}
  if(!voice){for(var j=0;j<vs.length;j++){if(/^en/i.test(vs[j].lang)){voice=vs[j];break;}}}
}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=pickVoice;pickVoice();}

function _stopAll(){
  if(window._curAudio){try{window._curAudio.pause();}catch(e){}window._curAudio=null;}
  if(window.speechSynthesis)speechSynthesis.cancel();
}

function speakWord(w){
  if(!w)return;
  _stopAll();
  var url="https://dict.youdao.com/dictvoice?audio="+encodeURIComponent(w)+"&type=2";
  var a=new Audio(url);
  window._curAudio=a;
  a.play().catch(function(){
    if(window.speechSynthesis){
      var u=new SpeechSynthesisUtterance(w);
      u.lang="en-GB";u.rate=0.85;
      if(voice)u.voice=voice;
      speechSynthesis.speak(u);
    }
  });
}
function speakExample(ex){
  if(!ex)return;
  _stopAll();
  if(!window.speechSynthesis)return;
  var u=new SpeechSynthesisUtterance(ex);
  u.lang="en-US";u.rate=0.82;
  if(voice)u.voice=voice;
  speechSynthesis.speak(u);
}
function speakWordAndExample(w,ex){speakWord(w);}

function show(id){
  var pages=document.querySelectorAll(".page");
  for(var i=0;i<pages.length;i++)pages[i].classList.remove("active");
  document.getElementById("page-"+id).classList.add("active");
  window.scrollTo(0,0);
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){var m={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};return m[c];});}

function doSearch(q){
  var box=document.getElementById("searchResults");
  if(!q||q.length<1){box.classList.remove("show");box.innerHTML="";return;}
  q=q.toLowerCase();var matches=[];
  for(var i=0;i<WORDS.length;i++){var w=WORDS[i];if(w.word.toLowerCase().indexOf(q)>=0){matches.push(w);if(matches.length>=20)break;}}
  if(!matches.length){box.innerHTML='<div class="search-empty">没找到匹配的单词</div>';box.classList.add("show");return;}
  var html="";
  for(var j=0;j<matches.length;j++){
    var m=matches[j];var zh=(m.zh&&m.zh.length)?m.zh[0]:"";
    if(zh.length>40)zh=zh.slice(0,40)+"...";
    html+='<div class="search-item" data-search-word="'+esc(m.word)+'">';
    html+='<div class="search-word">'+esc(m.word)+'</div>';
    html+='<div class="search-meta">'+esc(m.pos||"")+" "+esc(zh)+'</div>';
    html+='</div>';
  }
  box.innerHTML=html;box.classList.add("show");
}

function searchJumpTo(word){
  var target=null;
  for(var i=0;i<WORDS.length;i++){if(WORDS[i].word.toLowerCase()===word.toLowerCase()){target=WORDS[i];break;}}
  if(!target){showToast("未找到该词");return;}
  document.getElementById("searchBox").value="";
  document.getElementById("searchResults").classList.remove("show");
  document.getElementById("searchClear").classList.remove("show");
  _stopAll();VIEW_MODE=false;VIEW_STACK=[];S.finished=false;
  S.cur=target;S.revealed=false;
  var newQueue=[target];for(var j=0;j<S.queue.length;j++){if(S.queue[j].word!==target.word)newQueue.push(S.queue[j]);}
  S.queue=newQueue;S.total=Math.max(S.total,S.mastered+S.queue.length);
  show("study");renderCard();speakWord(target.word);
}

function enterViewMode(word){
  var target=null;
  for(var i=0;i<WORDS.length;i++){if(WORDS[i].word.toLowerCase()===word.toLowerCase()){target=WORDS[i];break;}}
  if(!target){showToast("词库中暂无该词");return;}
  hidePopup();_stopAll();
  VIEW_STACK.push({word:S.cur.word,revealed:S.revealed});
  VIEW_MODE=true;S.cur=target;S.revealed=false;
  renderCard();speakWord(target.word);
}
function exitViewMode(){
  if(!VIEW_STACK.length){VIEW_MODE=false;renderCard();return;}
  var prev=VIEW_STACK.pop();
  var target=WORD_MAP[prev.word];
  if(!target){for(var i=0;i<WORDS.length;i++){if(WORDS[i].word===prev.word){target=WORDS[i];break;}}}
  if(!target){VIEW_MODE=false;renderCard();return;}
  S.cur=target;S.revealed=prev.revealed;
  if(!VIEW_STACK.length)VIEW_MODE=false;
  renderCard();
}
function addCurrentToQueue(){
  if(!S.cur)return;
  var w=S.cur;
  for(var i=0;i<S.queue.length;i++){if(S.queue[i].word===w.word){showToast("已在队列中");return;}}
  S.queue.unshift(w);S.total++;showToast("已加入本轮");exitViewMode();
}

function renderHome(){
  var bc=document.getElementById("bookChips");
  var html="";
  for(var k in BOOKS){
    if(!BOOKS.hasOwnProperty(k))continue;
    var n;
    if(k==="unknown")n=S.unknown.length;
    else if(k==="all")n=WORDS.length;
    else n=WORDS.filter(function(w){return w.tags.indexOf(BOOKS[k].fn)>=0;}).length;
    var cls=S.book===k?"chip on":"chip";
    html+='<button class="'+cls+'" data-book="'+k+'">'+BOOKS[k].name+" "+n+'</button>';
  }
  bc.innerHTML=html;
  document.getElementById("noteCount").textContent=" "+S.unknown.length;
  var bks=bc.querySelectorAll("[data-book]");
  for(var i=0;i<bks.length;i++){bks[i].onclick=function(){S.book=this.dataset.book;renderHome();};}
  var ocs=document.getElementById("orderChips").querySelectorAll(".chip");
  for(var j=0;j<ocs.length;j++){ocs[j].classList.toggle("on",ocs[j].dataset.v===S.order);ocs[j].onclick=function(){S.order=this.dataset.v;renderHome();};}
  var scs=document.getElementById("sizeChips").querySelectorAll(".chip");
  for(var m=0;m<scs.length;m++){scs[m].classList.toggle("on",+scs[m].dataset.v===S.size);scs[m].onclick=function(){S.size=+this.dataset.v;renderHome();};}
  renderStats();
}

function getBookList(){
  if(S.book==="unknown"){var arr=[];for(var i=0;i<S.unknown.length;i++){if(WORD_MAP[S.unknown[i]])arr.push(WORD_MAP[S.unknown[i]]);}return arr;}
  if(S.book==="all")return WORDS.slice();
  var tag=BOOKS[S.book].fn;
  return WORDS.filter(function(w){return w.tags.indexOf(tag)>=0;});
}

function startStudy(){
  var list=getBookList();
  if(!list.length){alert("该词库暂无单词");return;}
  if(S.order==="alpha")list.sort(function(a,b){return a.word.localeCompare(b.word);});
  else if(S.order==="freq")list.sort(function(a,b){return b.freq-a.freq;});
  else list.sort(function(){return Math.random()-0.5;});
  S.queue=list.slice(0,Math.min(S.size,list.length));
  S.total=S.queue.length;S.mastered=0;S.finished=false;S.newUnknown=0;S.history=[];
  S.mode="study";
  VIEW_MODE=false;VIEW_STACK=[];
  show("study");nextCard();
}

function startReview(){
  var due=getDueWords();
  if(!due.length){showToast("今天没有要复习的词");return;}
  S.queue=due.slice();
  S.total=S.queue.length;S.mastered=0;S.finished=false;S.newUnknown=0;S.history=[];
  S.mode="review";
  VIEW_MODE=false;VIEW_STACK=[];
  show("study");nextCard();
}

function nextCard(){
  if(!S.queue.length){S.finished=true;renderCard();return;}
  S.cur=S.queue[0];S.revealed=false;
  renderCard();speakWord(S.cur.word);
}

function rate(r){
  if(VIEW_MODE)return;
  if(S.revealed||S.finished)return;
  var w=S.cur;if(!w)return;
  var lw = w.word.toLowerCase();
  var queueBefore=S.queue.slice();
  var masteredBefore=S.mastered;
  var showCountBefore=w._showCount||0;
  var wasInUnknown=S.unknown.indexOf(w.word)>=0;
  var addedToUnknown=false;
  var reviewBefore = reviewData[lw] ? JSON.parse(JSON.stringify(reviewData[lw])) : null;
  var firstTime = !reviewData[lw];

  S.queue.shift();

  if(firstTime){
    reviewData[lw] = {level:0, next:"", learnedAt:todayStr()};
    updateStatsOnLearn();
  }

  if(r==="known"){
    S.mastered++;
    w._showCount=0;
    var cur = reviewData[lw];
    cur.level = (cur.level||0) + 1;
    if(cur.level > 6) cur.level = 6;
    var days = REVIEW_INTERVALS[cur.level] || 1;
    cur.next = dateAdd(todayStr(), days);
  }else{
    if(r==="unknown" && !wasInUnknown){
      S.unknown.push(w.word);S.newUnknown++;
      addedToUnknown=true;
      safeSave("vocab_unknown",S.unknown);
    }
    if(r==="unknown"){w._showCount=(w._showCount||0)+3;}
    else if(r==="vague"){w._showCount=(w._showCount||0)+1;}
    var cur2 = reviewData[lw];
    if(cur2.level > 1) cur2.level = cur2.level - 1;
    cur2.next = dateAdd(todayStr(), 1);
    if(w._showCount > 0){
      var maxPos = Math.min(S.queue.length, 10);
      var pos = maxPos > 0 ? (1 + Math.floor(Math.random()*maxPos)) : 0;
      if(pos > S.queue.length) pos = S.queue.length;
      S.queue.splice(pos, 0, w);
      w._showCount--;
    }
  }
  safeSave("review_data_v1", reviewData);

  S.history.push({
    word:w.word, queueBefore:queueBefore, masteredBefore:masteredBefore,
    addedToUnknown:addedToUnknown, wasInUnknown:wasInUnknown,
    showCountBefore:showCountBefore,
    reviewBefore: reviewBefore,
    firstTime: firstTime
  });

  S.revealed=true;
  renderCard();
  speakWordAndExample(w.word,w.exEn);
  renderHome();
  if(r==="unknown"){
    if(addedToUnknown)showToast("已加入生词本 · 稍后再见");
    else if(wasInUnknown)showToast("已在生词本 · 稍后再见");
  }else if(r==="vague"){
    showToast("模糊 · 稍后再见");
  }
}

function undoLastRating(){
  if(VIEW_MODE)return;
  if(!S.history.length){showToast("没有可撤销的操作");return;}
  var h=S.history.pop();
  S.queue=h.queueBefore;S.mastered=h.masteredBefore;
  S.cur=WORD_MAP[h.word];
  if(!S.cur){for(var i=0;i<WORDS.length;i++){if(WORDS[i].word===h.word){S.cur=WORDS[i];break;}}}
  if(S.cur){S.cur._showCount=h.showCountBefore||0;}
  var lw = h.word.toLowerCase();
  if(h.firstTime){
    delete reviewData[lw];
  }else if(h.reviewBefore){
    reviewData[lw] = h.reviewBefore;
  }
  safeSave("review_data_v1", reviewData);

  S.revealed=false;
  S.finished=false;
  var toastMsg="已撤销，请重新选择";
  if(h.addedToUnknown&&!h.wasInUnknown){
    var newUnknown=[];
    for(var j=0;j<S.unknown.length;j++){if(S.unknown[j]!==h.word)newUnknown.push(S.unknown[j]);}
    S.unknown=newUnknown;
    safeSave("vocab_unknown",S.unknown);
    if(S.newUnknown>0)S.newUnknown--;
    toastMsg="已移出生词本";
  }
  renderCard();renderHome();showToast(toastMsg);
}

function showToast(msg){
  var t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t);}
  t.textContent=msg;t.classList.add("show");
  if(t._timer)clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.classList.remove("show");},1800);
}

function renderForms(w){
  var f=FORMS_MAP[w.word];if(!f)return "";
  var items=[];
  if(f.p)items.push(["过去式",f.p]);
  if(f.d)items.push(["过去分词",f.d]);
  if(f.i)items.push(["现在分词",f.i]);
  if(f["3"])items.push(["三单",f["3"]]);
  if(f.s)items.push(["复数",f.s]);
  if(f.r)items.push(["比较级",f.r]);
  if(f.t)items.push(["最高级",f.t]);
  if(!items.length)return "";
  var h='<div class="forms"><div class="forms-title">词形变化</div><div class="forms-list">';
  for(var i=0;i<items.length;i++){h+='<span class="form-item"><b>'+items[i][0]+'</b><span>'+items[i][1]+'</span></span>';}
  h+='</div></div>';return h;
}

function renderRootForWord(w){
  var info = ROOT_MAP[w.word.toLowerCase()];
  if(!info) return "";
  var h = '<div class="root-line"><span class="root-name">'+esc(info.root)+'</span><span class="root-mean">'+esc(info.meaning)+'</span></div>';
  h += '<div style="font-size:13px;color:var(--text-main);font-family:\'SF Mono\',Menlo,monospace;margin-top:4px">'+esc(info.split)+'</div>';
  h += '<div class="root-word-note" style="margin-top:6px">'+esc(info.note)+'</div>';
  return h;
}

function renderCard(){
  var area=document.getElementById("cardArea");
  var pct=S.total?(S.mastered/S.total*100):0;
  document.getElementById("pFill").style.width=pct+"%";
  var modeLabel = S.mode==="review" ? "复习 " : "背诵 ";
  document.getElementById("pText").textContent=modeLabel+S.mastered+" / "+S.total+"  剩余 "+S.queue.length;
  if(S.finished){
    var hf='<div class="card finished"><div class="finish-icon">&#127881;</div><h2>'+(S.mode==="review"?"复习完成":"本轮完成")+'</h2>';
    hf+="<p>共掌握 <b>"+S.total+"</b> 个单词</p>";
    hf+="<p>生词本新增 "+S.newUnknown+" 个</p></div>";
    hf+='<button class="btn-primary" data-act="home">返回首页</button>';
    area.innerHTML=hf;return;
  }
  var w=S.cur;if(!w){area.innerHTML="";return;}
  var out="";
  if(VIEW_MODE){out+='<div class="view-banner">查看模式 · 不影响本轮</div>';}
  out+='<div class="card"><div class="word-head">';
  out+='<div class="word-en">'+w.word+'</div>';
  out+='<div class="phonetic">'+(w.ph||"")+'</div></div>';
  out+='<button class="spk-big" data-act="say-word">朗读单词</button>';
  if(!S.revealed){
    out+='<div class="hint">'+(VIEW_MODE?"点下方按钮查看释义":"先判断你是否认识这个词")+'</div>';
  }else{
    out+='<div class="reveal">';
    out+='<div class="pos-line"><span class="pos">'+(w.pos||"—")+'</span></div>';
    var zhArr=(w.zh&&w.zh.length)?w.zh:["（暂无中文释义）"];
    out+='<div class="zh">';
    for(var i=0;i<zhArr.length;i++)out+="<div>"+zhArr[i]+"</div>";
    out+='</div>';
    if(w.en)out+='<div class="en-def">'+w.en+'</div>';
    out+=renderForms(w);
    if(w.exEn){
      out+='<div class="example">';
      out+='<div class="ex-en">'+w.exEn+'</div>';
      out+='<div class="ex-zh">'+(w.exZh||"")+'</div>';
      out+='<button class="spk-mini" data-act="say-ex">🔊 朗读例句</button>';
      out+='</div>';
    }
    if(w.col&&w.col.length){
      out+='<div class="block"><div class="block-title">常用搭配</div><ul class="col-list">';
      for(var c=0;c<w.col.length;c++)out+="<li>"+w.col[c]+"</li>";
      out+='</ul></div>';
    }
    if(w.gram)out+='<div class="gram">'+w.gram+'</div>';
    var rootHtml = renderRootForWord(w);
    if(rootHtml){out+='<div class="fold"><button class="fold-btn" data-act="fold">词根词缀</button><div class="fold-body">'+rootHtml+'</div></div>';}
    if((w.syn&&w.syn.length)||(w.ant&&w.ant.length)){
      out+='<div class="fold"><button class="fold-btn" data-act="fold">同义词 / 反义词</button><div class="fold-body">';
      if(w.syn&&w.syn.length){
        out+='<div style="margin-bottom:10px"><b style="color:var(--text-sub);font-size:12px">同义词</b><div class="tag-list" style="margin-top:6px">';
        for(var s=0;s<w.syn.length;s++){out+='<span class="tag clickable" data-lookup="'+w.syn[s]+'">'+w.syn[s]+'</span>';}
        out+='</div></div>';
      }
      if(w.ant&&w.ant.length){
        out+='<div><b style="color:var(--text-sub);font-size:12px">反义词</b><div class="tag-list" style="margin-top:6px">';
        for(var an=0;an<w.ant.length;an++){out+='<span class="tag ant clickable" data-lookup="'+w.ant[an]+'">'+w.ant[an]+'</span>';}
        out+='</div></div>';
      }
      out+='</div></div>';
    }else{
      out+='<div class="fold"><button class="fold-btn" data-act="fold">同义词 / 反义词</button><div class="fold-body"><div style="color:var(--text-sub);font-size:12.5px;opacity:.7">正在查询…</div></div></div>';
    }
    if(w.conf&&w.conf.length){
      out+='<div class="fold"><button class="fold-btn" data-act="fold">易混词辨析</button><div class="fold-body">';
      for(var cf=0;cf<w.conf.length;cf++){out+='<div class="conf-item">'+w.conf[cf]+'</div>';}
      out+='</div></div>';
    }
    out+='</div>';
  }
  out+='</div>';
  if(VIEW_MODE){
    if(!S.revealed){

function hidePopup(){var p=document.getElementById("popup");if(p){p.classList.remove("show");p._anchor=null;}}
function positionPopup(popup,anchor){
  if(!anchor||!popup.classList.contains("show"))return;
  var r=anchor.getBoundingClientRect();
  popup.style.left="0px";popup.style.top="0px";
  var pw=popup.offsetWidth;var ph=popup.offsetHeight;
  var left=r.left+r.width/2-pw/2;var top=r.bottom+8;
  left=Math.max(8,Math.min(left,window.innerWidth-pw-8));
  if(top+ph>window.innerHeight-8)top=Math.max(8,r.top-ph-8);
  popup.style.left=left+"px";popup.style.top=top+"px";
}
function openPopup(anchor){
  var word=anchor.dataset.lookup;if(!word)return;
  var popup=document.getElementById("popup");
  popup._anchor=anchor;popup.classList.add("show");
  var local=null;
  for(var i=0;i<WORDS.length;i++){if(WORDS[i].word.toLowerCase()===word.toLowerCase()){local=WORDS[i];break;}}
  var html='<span class="popup-close" data-pop="close">X</span>';
  html+='<div class="popup-word">'+word+'</div>';
  if(local){
    if(local.ph)html+='<div class="popup-ph">'+local.ph+'</div>';
    var zhText=(local.zh&&local.zh.length)?local.zh.join("；"):"";
    if(zhText){
      var posTag=local.pos?'<span class="popup-pos">'+local.pos+'</span>':"";
      html+='<div class="popup-zh" data-jump="'+word+'">'+posTag+zhText+'</div>';
    }
    if(local.en)html+='<div class="popup-en">'+local.en+'</div>';
    if(zhText)html+='<div class="popup-tip">点中文释义可跳到该词卡片</div>';
  }else{
    html+='<div class="popup-loading">词库中未收录该词</div>';
  }
  popup.innerHTML=html;positionPopup(popup,anchor);
}

      var newU=[];for(var i=0;i<S.unknown.length;i++){if(S.unknown[i]!==el.dataset.w)newU.push(S.unknown[i]);}

function parseCSV(text){
  var rows=[];var row=[];var f="";var q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}
      else{f+=c;}
    }else{
      if(c==='"')q=true;
      else if(c===","){row.push(f);f="";}
      else if(c==="\n"){row.push(f);rows.push(row);row=[];f="";}
      else if(c==="\r"){}
      else f+=c;
    }
  }
  if(f||row.length){row.push(f);rows.push(row);}
  return rows;
}

function importCSV(text){
  var statusEl=document.getElementById("importStatus");
  statusEl.textContent="解析中...";
  setTimeout(function(){
    var rows;
    try{rows=parseCSV(text);}catch(e){statusEl.textContent="解析失败: "+e.message;return;}
    if(!rows.length){statusEl.textContent="文件为空";return;}
    var header=rows[0].map(function(s){return s.trim().toLowerCase().replace(/^\ufeff/,"");});
    function col(n){return header.indexOf(n);}
    var iW=col("word"),iP=col("phonetic"),iT=col("translation"),iPo=col("pos"),iTag=col("tag"),iFrq=col("frq"),iColl=col("collins");
    if(iW<0||iTag<0){statusEl.textContent="CSV 缺少 word 或 tag 列";return;}
    var posMap={n:"n.",v:"v.",adj:"adj.",adv:"adv.",prep:"prep.",conj:"conj.",pron:"pron.",num:"num.",art:"art.",int:"int.",aux:"aux.",abbr:"abbr.",vt:"vt.",vi:"vi."};
    var tagMap={cet6:"cet6",ky:"kaoyan",cet4:"cet4",toefl:"toefl",ielts:"ielts"};
    var added=0,skipped=0,total=0;
    for(var i=1;i<rows.length;i++){
      var r=rows[i];if(!r||!r[iW])continue;total++;
      var tagArr=(r[iTag]||"").toLowerCase().split(/\s+/).filter(Boolean);
      var hit=false;
      for(var t=0;t<importTags.length;t++){if(tagArr.indexOf(importTags[t])>=0){hit=true;break;}}
      if(!hit){skipped++;continue;}
      var word=r[iW].trim();
      if(!word||/\s/.test(word)){skipped++;continue;}
      var ph=(r[iP]||"").trim();
      if(ph&&ph.indexOf("/")!==0)ph="/"+ph.replace(/^\/|\/$/g,"")+"/";
      var zh=(r[iT]||"").replace(/\\n/g,"|").replace(/\r?\n/g,"|").replace(/\|+/g,"|").replace(/^\||\|$/g,"").trim();
      var pos="";
      var rawPos=(r[iPo]||"").trim();
      if(rawPos){
        var parts=rawPos.split("/");var posArr=[];
        for(var p=0;p<parts.length;p++){var kk=parts[p].split(":")[0].trim().toLowerCase();if(posMap[kk])posArr.push(posMap[kk]);}
        pos=posArr.join(" / ");
      }
      var tags=[];
      for(var ta=0;ta<tagArr.length;ta++){if(tagMap[tagArr[ta]])tags.push(tagMap[tagArr[ta]]);}
      var collins=+r[iColl]||0;if(collins>=4)tags.push("core");
      var frqRaw=+r[iFrq]||0;
      if(frqRaw>0&&frqRaw<8000)tags.push("high");
      var freq=frqRaw>0?Math.max(1,Math.min(100,Math.round(100-Math.log10(frqRaw+1)*18))):50;
      addWord({word:word,ph:ph,pos:pos,zh:zh?zh.split("|"):[],en:"",exEn:"",exZh:"",col:[],syn:[],ant:[],conf:[],gram:"",tags:tags,freq:freq});
      added++;
    }
    saveImportedWords();
    statusEl.textContent="导入完成！新增 "+added+" 个，跳过 "+skipped+" 个";
    renderHome();
    alert("导入成功，新增 "+added+" 个单词");
  },30);
}

function importJSON(text){
  var statusEl=document.getElementById("importStatus");
  try{
    var data=JSON.parse(text);
    if(!Array.isArray(data)){statusEl.textContent="JSON 不是数组";return;}
    var added=0;
    for(var i=0;i<data.length;i++){var o=parseItem(data[i]);if(o.word){addWord(o);added++;}}
    saveImportedWords();
    statusEl.textContent="JSON 导入完成，新增 "+added+" 个";
    alert("JSON 导入成功，新增 "+added+" 个单词");
    renderHome();
  }catch(err){statusEl.textContent="JSON 解析失败: "+err.message;}
}

document.getElementById("fileInput").onchange=function(ev){
  var f=ev.target.files[0];if(!f)return;
  var name=f.name.toLowerCase();
  var rd=new FileReader();
  if(name.indexOf(".csv")>=0){rd.onload=function(){importCSV(rd.result);};rd.readAsText(f,"UTF-8");}
  else if(name.indexOf(".json")>=0||name.indexOf(".txt")>=0){rd.onload=function(){importJSON(rd.result);};rd.readAsText(f,"UTF-8");}
  else{alert("支持 .csv / .json / .txt");}
  ev.target.value="";
};

document.getElementById("formsFileInput").onchange=function(ev){
  var f=ev.target.files[0];if(!f)return;
  if(f.name.toLowerCase().indexOf(".csv")<0){alert("请选择 CSV 文件");ev.target.value="";return;}
  showToast("正在读取 CSV...（30 秒左右）");
  var rd=new FileReader();
  rd.onload=function(){
    setTimeout(function(){
      try{
        var rows=parseCSV(rd.result);
        if(!rows.length){showToast("文件为空");return;}
        var header=rows[0].map(function(s){return s.trim().toLowerCase().replace(/^\ufeff/,"");});
        var iW=header.indexOf("word");var iEx=header.indexOf("exchange");
        if(iW<0||iEx<0){showToast("CSV 缺少 word 或 exchange 列");return;}
        var newForms={};var added=0;var skipped=0;
        for(var i=1;i<rows.length;i++){
          var r=rows[i];if(!r||!r[iW]||!r[iEx])continue;
          var word=r[iW].trim();if(!word)continue;
          if(!WORD_MAP[word]){skipped++;continue;}
          var ex=r[iEx];var parsed={};var parts=ex.split("/");
          for(var x=0;x<parts.length;x++){var kv=parts[x].split(":");if(kv.length===2)parsed[kv[0]]=kv[1];}
          if(Object.keys(parsed).length){newForms[word]=parsed;added++;}
        }
        FORMS_MAP=newForms;
        safeSave("word_forms_v1",FORMS_MAP);
        showToast("已补全 "+added+" 个（跳过 "+skipped+" 个）");
        if(S.cur&&S.revealed)renderCard();
      }catch(e){showToast("解析失败："+e.message);}
    },30);
  };
  rd.readAsText(f,"UTF-8");
  ev.target.value="";
};
