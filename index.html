</div>

      en: item[4] || '',

      syn: item[7] ? String(item[7]).split('|') : [],

      gram: item[10] || '',

      freq: item[12] || 50

function parseCSV(text) {
  var rows = [], row = [], f = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
      else if (c === '\r') {}
      else f += c;
    }
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function importCSV(text) {

  statusEl.textContent = '解析中...';

    var rows;

    if (!rows.length) { statusEl.textContent = '文件为空'; return; }
    var header = rows[0].map(function (s) { return s.trim().toLowerCase().replace(/^\ufeff/, ''); });
    function col(n) { return header.indexOf(n); }
    var iW = col('word'), iP = col('phonetic'), iT = col('translation'),
        iPo = col('pos'), iTag = col('tag'), iFrq = col('frq'), iColl = col('collins');
    if (iW < 0 || iTag < 0) { statusEl.textContent = 'CSV 缺少 word 或 tag 列'; return; }
    var posMap = { n:'n.', v:'v.', adj:'adj.', adv:'adv.', prep:'prep.', conj:'conj.',
                   pron:'pron.', num:'num.', art:'art.', int:'int.', aux:'aux.',
                   abbr:'abbr.', vt:'vt.', vi:'vi.' };
    var tagMap = { cet6:'cet6', ky:'kaoyan', cet4:'cet4', toefl:'toefl', ielts:'ielts' };
    var added = 0, skipped = 0, total = 0;
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i]; if (!r || !r[iW]) continue;
      total++;
      var tagArr = (r[iTag] || '').toLowerCase().split(/\s+/).filter(Boolean);
      var hit = false;
      for (var t = 0; t < importTags.length; t++) if (tagArr.indexOf(importTags[t]) >= 0) { hit = true; break; }
      if (!hit) { skipped++; continue; }
      var word = r[iW].trim(); if (!word || /\s/.test(word)) { skipped++; continue; }
      var ph = (r[iP] || '').trim();
      if (ph && ph.indexOf('/') !== 0) ph = '/' + ph.replace(/^\/|\/$/g, '') + '/';
      var zh = (r[iT] || '').replace(/\\n/g, '|').replace(/\r?\n/g, '|').replace(/\|+/g, '|').replace(/^\||\|$/g, '').trim();
      var pos = '';
      var rawPos = (r[iPo] || '').trim();
      if (rawPos) {
        var parts = rawPos.split('/');
        var posArr = [];
        for (var p = 0; p < parts.length; p++) { var k = parts[p].split(':')[0].trim().toLowerCase(); if (posMap[k]) posArr.push(posMap[k]); }
        pos = posArr.join(' / ');
      }
      var tags = [];

      var collins = +r[iColl] || 0; if (collins >= 4) tags.push('core');

    } catch (e) { console.log('vocab.json 解析失败', e); }
  };
  xhr.send();
})();

(function autoLoadForms() {
  if (location.protocol === 'file:') return;
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'forms.json?_=' + Date.now(), true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    if (xhr.status !== 200) return;
    try {
      var data = JSON.parse(xhr.responseText);
      if (typeof data !== 'object' || Array.isArray(data)) return;
      var count = 0;
      for (var k in data) if (data.hasOwnProperty(k)) { FORMS_MAP[k] = data[k]; count++; }
      if (count > 0) { console.log('自动加载词形变化：' + count + ' 个'); if (S.cur && S.revealed) renderCard(); }
    } catch (e) {}
  };
  xhr.send();
})();
</script>
